workflows:
  # ═══════════════════════════════════════════════════════════
  # ANDROID DEBUG BUILD — No Google Play account needed
  # Produces an APK you can install directly on your phone
  # ═══════════════════════════════════════════════════════════
  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 18
      java: 17
      vars:
        PACKAGE_NAME: "com.autosyncshopmanager.app"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Add Android platform and sync
        script: |
          npx cap add android 2>/dev/null || true
          npx cap sync android
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  # ═══════════════════════════════════════════════════════════
  # iOS SIMULATOR BUILD — No Apple Developer account needed
  # Produces an .app you can test in Xcode Simulator
  # ═══════════════════════════════════════════════════════════
  ios-debug:
    name: iOS Debug Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 18
      xcode: latest
      cocoapods: default
      vars:
        PACKAGE_NAME: "com.autosyncshopmanager.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Add iOS platform and sync
        script: |
          npx cap add ios 2>/dev/null || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build for simulator
        script: |
          cd ios/App
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Build/Products/Debug-iphonesimulator/*.app

